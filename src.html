<!DOCTYPE html>
<html lang="en">
    <head>
        <title>new products in our store</title>
    </head>
    <body>
        <h1>New awesome product</h1>
        <p>Welcome to our store! We have the latest products available.</p>
        <img src="https://blob.sololearn.com/courses/np.png" alt="New Awesome Product">
        <!--add a paragraph description-->
        <p><i>Introducing our</i><b>latest product</b>,desined to make your life easier and more efficient</p>
        <ul>
            <li>Feature 1: <span>High-quality materials</span></li>
            <li>Feature 2: <span>Easy to use</span></li>
            <li>Feature 3: <span>Great value for money</span></li>
        </ul>
        <h2>order now!</h2>
        <form>
            <label for="s1">Size:</label>
            <select id="s1" name="size">
                <option value="small">Small</option>
                <option value="medium">Medium</option>
                <option value="large">Large</option>
            </select><br><br>
            <label for="c1">Color:</label>
            <select id="c1" name="color">
                <option value="red">Red</option>
                <option value="blue">Blue</option>
                <option value="green">Green</option>
                <option value="yellow">Yellow</option>
                <option value="white">White</option>
            </select><br><br>
            <label for="name">Name:</label>
            <input type="text" id="name" name="name"><br><br>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email"><br><br>
            <input type="submit" value="Order Now">
        </form>
    </body>
</html>
