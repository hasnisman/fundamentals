<!DOCTYPE html>
<html lang="en">
    <head>
        <title>audio player</title>
    </head>
    <body>
        <button>
            <audio controls>
                <source src="file.mp3" type="audio/mpeg">
                <source src="file.ogg" type="audio/ogg">
                audio not supported
            </audio>
             <audio autoplay>
                <source src="file.mp3" type="audio/mpeg">
                <source src="file.ogg" type="audio/ogg">
                audio not supported
            </audio>
             <audio mute>
                <source src="file.mp3" type="audio/mpeg">
                <source src="file.ogg" type="audio/ogg">
                audio not supported
            </audio>
             <audio loop>
                <source src="file.mp3" type="audio/mpeg">
                <source src="file.ogg" type="audio/ogg">
                audio not supported
            </audio>
        </button>
    </body>
</html>
